{% extends "base.html" %}
{% block title %}Logs{% endblock %}
{% block content %}
<div id="logs-root">

  <div class="page-header">
    <h1 class="page-title">Activity Logs</h1>
    <p class="page-subtitle">Recent command and tool execution history.</p>
  </div>

  <div class="card">
    <div class="flex items-center gap-3 mb-3">
      <span class="text-sm text-muted">Last 50 entries</span>
      <button id="logs-refresh" class="btn btn-ghost btn-sm" type="button">Refresh</button>
    </div>
    <div class="table-wrap">
      <table class="table">
        <thead>
          <tr>
            <th>Time</th>
            <th>Command</th>
            <th>Tool</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="logs-tbody">
          <tr>
            <td colspan="4" class="empty">Loading&hellip;</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
{% endblock %}

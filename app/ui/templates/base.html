<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}JARVIS{% endblock %} — Local AI Assistant</title>
  <link rel="stylesheet" href="/ui/static/style.css">
</head>
<body>

<nav class="nav">
  <span class="nav-brand">JARVIS</span>
  <div class="nav-links">
    <a href="/ui/" class="nav-link{% if page == 'dashboard' %} active{% endif %}">Dashboard</a>
    <a href="/ui/chat" class="nav-link{% if page == 'chat' %} active{% endif %}">Chat</a>
    <a href="/ui/actions" class="nav-link{% if page == 'actions' %} active{% endif %}">Actions</a>
    <a href="/ui/logs" class="nav-link{% if page == 'logs' %} active{% endif %}">Logs</a>
    <a href="/ui/memory" class="nav-link{% if page == 'memory' %} active{% endif %}">Memory</a>
    <a href="/ui/voice" class="nav-link{% if page == 'voice' %} active{% endif %}">Voice</a>
    <a href="/ui/help" class="nav-link{% if page == 'help' %} active{% endif %}">Help</a>
    <a href="/docs" class="nav-link" target="_blank" rel="noopener noreferrer">API Docs &#8599;</a>
  </div>
</nav>

<main class="main">
  {% block content %}{% endblock %}
</main>

<script src="/ui/static/app.js"></script>
{% block scripts %}{% endblock %}

</body>
</html>

name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: "Python 3.11 / ubuntu-latest"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      # tests/test_coding_browser_qa.py drives a real browser over the
      # DevTools protocol and is deliberately NOT behind the `browser`
      # marker: on Windows it runs against the Edge that every target
      # machine has, and that coverage is the point of the suite.
      #
      # This job had no browser installed at all, so browser_engine fell
      # through to whatever `google-chrome` the runner image happens to
      # ship, which did not start — fifteen failures reported only as
      # "The browser connection closed." Installing the same Chromium the
      # Playwright job uses puts it in ~/.cache/ms-playwright, which
      # browser_engine consults ahead of PATH, so Ubuntu and Windows now
      # exercise the same code against a browser that works.
      - name: Install Chromium (with OS deps) for the Coding Workspace checks
        run: playwright install --with-deps chromium

      - name: Compile check (app + db)
        run: python -m compileall app db

      - name: Run tests
        run: pytest
        env:
          # Use a writable temp path for the SQLite DB so CI never
          # needs write access outside the checkout directory.
          JARVIS_DB_PATH: /tmp/ci_jarvis_test.db
          # Suppress verbose log output during tests.
          JARVIS_LOG_LEVEL: WARNING

  browser-tests:
    name: "Playwright + axe / ubuntu-latest"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Install Chromium (with OS deps)
        run: playwright install --with-deps chromium

      - name: Run browser + accessibility tests
        # These are here rather than in the default run because they need
        # a real Chromium.
        #
        # test_clap_detection.py exercises the detector against a real
        # microphone capture path with synthesised audio, which is the
        # only way to know it fires on a clap and stays quiet on speech.
        #
        # test_clap_controller.py asserts the listener's lifecycle
        # against real MediaStreamTracks, AudioContexts, worklet nodes,
        # listeners and timers — privacy mode releasing the microphone,
        # the selected device reaching getUserMedia, reference-counted
        # suspension, and bounded calibration. A mocked version of any of
        # it would have passed against the build that left the microphone
        # running.
        #
        # tests/test_coding_preview.py carries three `browser` tests of its
        # own — a real browser check finding real defects, the screenshot
        # that must name neither the user nor a path, and the check running
        # from a thread that already has an event loop. They were deselected
        # from the default job by the marker and absent from this list, so
        # they ran in no CI job at all. The file's other tests are not
        # marked and keep running in the default job; `-m browser` picks
        # only the three here.
        run: >
          pytest -m browser -v
          tests/test_playwright_e2e.py
          tests/test_clap_detection.py
          tests/test_clap_controller.py
          tests/test_coding_preview.py
        env:
          JARVIS_DB_PATH: /tmp/ci_jarvis_browser_test.db
          JARVIS_LOG_LEVEL: WARNING
          # Unset on a real runner — the in-repo default lets Playwright
          # resolve its own installed browser normally. Only needed as an
          # override in nonstandard sandboxes with a mismatched prebuilt
          # Chromium (see the live_server fixture's browser_instance).

  windows-smoke:
    name: "Windows smoke / windows-latest"
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile check (app + db)
        run: python -m compileall app db

      - name: Imports + FastAPI startup smoke
        run: python scripts/ci_windows_smoke.py
        env:
          JARVIS_DB_PATH: ci_windows_smoke.db

      - name: Run full test suite on Windows
        run: pytest -v
        env:
          # Relative path — portable across OSes, written under the
          # checkout directory. `pytest` (no -m) already excludes the
          # `browser` marker via pytest.ini's addopts, so this never
          # launches a browser on this runner.
          JARVIS_DB_PATH: ci_jarvis_test.db
          JARVIS_LOG_LEVEL: WARNING
          # ANTHROPIC_API_KEY is deliberately left unset: proves the
          # text-only local-fallback path (app/core/brain.py) works with
          # no credentials, per this job's scope. Every Anthropic SDK call
          # in the suite itself is mocked regardless (CLAUDE.md).

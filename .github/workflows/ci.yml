name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: "Python 3.11 / ubuntu-latest"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile check (app + db)
        run: python -m compileall app db

      - name: Secret scan (tracked files)
        run: python scripts/secret_scan.py

      - name: Confirm pwsh is available for the artifact-scanner tests
        # ubuntu-latest ships PowerShell (pwsh) by default. This step exists
        # only for visibility: tests/test_scan_artifacts_ps1.py skips (not
        # fails) if pwsh is missing, so without this, that coverage could
        # silently stop running if the runner image ever changes and no one
        # would notice from the test summary alone.
        run: |
          if command -v pwsh >/dev/null 2>&1; then
            echo "pwsh found: $(pwsh -Version)"
          else
            echo "::warning::pwsh not found — installer/scan_artifacts.ps1 will not be executed this run (tests/test_scan_artifacts_ps1.py will report as skipped, not failed)."
          fi

      - name: Run tests
        run: pytest
        env:
          # Use a writable temp path for the SQLite DB so CI never
          # needs write access outside the checkout directory.
          JARVIS_DB_PATH: /tmp/ci_jarvis_test.db
          # Suppress verbose log output during tests.
          JARVIS_LOG_LEVEL: WARNING

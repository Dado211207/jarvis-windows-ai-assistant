name: "Diagnose: terminated-PID visibility"

# A temporary, targeted diagnostic for the msedge.exe survivor
# investigation. It runs one measurement and produces a record; it builds
# nothing, installs nothing, and asserts nothing about the product.
#
# Scoped to its own branch on purpose. The three real workflows all
# trigger on `pull_request` or on `push` to `main`, so a push to this
# branch fires this job and nothing else — the investigation stays inside
# its agreed run budget instead of spending it on unrelated builds.
#
# Delete this file once the question it exists to answer is settled.
on:
  workflow_dispatch:
  push:
    branches:
      - "claude/diagnose-pid-visibility"

jobs:
  measure:
    name: "Terminated-PID visibility / windows-latest"
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install psutil only
        # Deliberately not the full requirements file: this measures
        # psutil's behaviour, so the fewer other packages present the
        # less there is to explain away.
        run: python -m pip install --disable-pip-version-check "psutil==7.2.2"

      - name: Measure how long a terminated process stays visible
        run: >-
          python scripts/diagnose_terminated_pid_visibility.py
          --repeat 8
          --out ${{ runner.temp }}/pid-visibility.jsonl

      - name: Upload the record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pid-visibility
          path: ${{ runner.temp }}/pid-visibility.jsonl
          retention-days: 14
          if-no-files-found: warn

  survivor:
    name: "Real Edge survivor probe / windows-latest"
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check -r requirements-windows.txt

      - name: Drive the real browser-QA route and probe any survivor
        # `continue-on-error` because a captured failure is the point. The
        # test's own assertions are unchanged and still fail the test;
        # this step must not turn the *investigation* red for having
        # succeeded at reproducing the thing it is investigating.
        continue-on-error: true
        run: >-
          python scripts/diagnose_survivor_flake.py
          --iterations 6
          --all-routes
          --stop-on-capture
          --verbose
          --diagnostics ${{ runner.temp }}/survivor-native.jsonl
        env:
          JARVIS_LOG_LEVEL: WARNING
          JARVIS_DB_PATH: ${{ runner.temp }}/survivor_native.db

      - name: Upload the record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: survivor-native
          path: ${{ runner.temp }}/survivor-native.jsonl
          retention-days: 14
          if-no-files-found: warn

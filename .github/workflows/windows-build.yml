name: Windows Build

on:
  workflow_dispatch:
    inputs:
      survivor_iterations:
        # Temporary scaffolding for the msedge.exe survivor investigation
        # (PR #17). "0" — the default, and the value on every automatic
        # trigger — skips the diagnostics step entirely, so ordinary runs
        # of this workflow are unchanged.
        #
        # It lives here rather than in a workflow of its own because
        # `workflow_dispatch` only registers from the default branch, and
        # a diagnostic that cannot be dispatched until it is merged is not
        # a diagnostic. Remove this input and the two steps below once the
        # survivor question is answered.
        description: "Survivor diagnostics: how many times to repeat the failing routes (0 = skip)"
        required: false
        default: "0"
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: "Windows Executable / Python 3.11"
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Compile check (app + db)
        run: python -m compileall app db

      - name: Run tests
        run: pytest
        env:
          # Write the test DB to the runner temp dir so CI never writes
          # inside the checkout directory.
          JARVIS_DB_PATH: ${{ runner.temp }}/ci_jarvis_test.db
          JARVIS_LOG_LEVEL: WARNING

      # --- temporary: msedge.exe survivor diagnostics (PR #17) ---------------
      #
      # Skipped unless dispatched with a non-zero iteration count, so every
      # pull-request and push run of this workflow is unchanged. It repeats
      # only the two routes that failed on Windows Installer run
      # 33251235787, with the cleanup path's JSONL recorder switched on.
      #
      # `continue-on-error` because this is evidence, not a gate: whether
      # the survivor reappears must never decide whether the build is
      # publishable. Delete both steps once the question is answered.
      - name: "Survivor diagnostics: repeat the failing routes"
        if: inputs.survivor_iterations != '' && inputs.survivor_iterations != '0'
        continue-on-error: true
        run: >-
          python scripts/diagnose_survivor_flake.py
          --iterations ${{ inputs.survivor_iterations }}
          --diagnostics ${{ runner.temp }}/survivor-diagnostics.jsonl
        env:
          JARVIS_DB_PATH: ${{ runner.temp }}/survivor_jarvis_test.db
          JARVIS_LOG_LEVEL: WARNING

      - name: "Survivor diagnostics: upload the record"
        # `always()` because a captured failure is the point — the record
        # is most valuable exactly when the step above went red.
        if: always() && inputs.survivor_iterations != '' && inputs.survivor_iterations != '0'
        uses: actions/upload-artifact@v4
        with:
          name: survivor-diagnostics
          path: ${{ runner.temp }}/survivor-diagnostics.jsonl
          retention-days: 14
          if-no-files-found: warn
      # --- end temporary ------------------------------------------------------

      - name: Build Windows executable
        run: >-
          pyinstaller
          --name JARVIS
          --onedir
          --noconfirm
          --clean
          --collect-all pydantic_settings
          --collect-all anthropic
          --collect-all pyttsx3
          --hidden-import pyttsx3.drivers.sapi5
          --hidden-import comtypes
          --hidden-import comtypes.client
          --add-data "README.md;."
          --add-data ".env.example;."
          --add-data "app/ui/templates;app/ui/templates"
          --add-data "app/ui/static;app/ui/static"
          run_jarvis.py

      - name: Copy helper files into distribution
        shell: pwsh
        run: |
          Copy-Item START_JARVIS.bat     dist\JARVIS\
          Copy-Item START_JARVIS_API.bat dist\JARVIS\
          Copy-Item SETUP_ENV.bat        dist\JARVIS\
          Copy-Item QUICKSTART.md        dist\JARVIS\
          Copy-Item .env.example         dist\JARVIS\

      - name: Package build into ZIP
        shell: pwsh
        run: Compress-Archive -Path dist\JARVIS -DestinationPath JARVIS-Windows-Build.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-Build
          path: JARVIS-Windows-Build.zip
          retention-days: 30

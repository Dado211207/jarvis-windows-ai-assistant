name: Windows Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: "Windows Build / Python 3.11"
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Compile check (app + db)
        run: python -m compileall app db

      - name: Run tests
        run: pytest
        env:
          # Write the test DB to the runner temp dir so CI never writes
          # inside the checkout directory.
          JARVIS_DB_PATH: ${{ runner.temp }}/ci_jarvis_test.db
          JARVIS_LOG_LEVEL: WARNING

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          # app/__init__.py's __version__ is the single source of truth —
          # never hardcode the version anywhere else in this workflow.
          $version = python -c "import app; print(app.__version__)"
          Write-Host "Building version: $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build Windows executable
        # Intentionally does NOT bundle README.md or .env.example — neither is
        # read at runtime, and doing so would leak dev-oriented files into the
        # installed app's directory via the Inno Setup step below (which reads
        # this same dist\JARVIS\ output). Both are added to the portable ZIP
        # only, in the separate step further down.
        run: >-
          pyinstaller
          --name JARVIS
          --onedir
          --noconfirm
          --clean
          --collect-all pydantic_settings
          --collect-all anthropic
          --collect-all pyttsx3
          --hidden-import pyttsx3.drivers.sapi5
          --hidden-import comtypes
          --hidden-import comtypes.client
          --add-data "app/ui/templates;app/ui/templates"
          --add-data "app/ui/static;app/ui/static"
          run_jarvis.py

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.version }}" installer\JARVIS.iss

      - name: Copy portable-ZIP helper files into distribution
        # Only the portable ZIP gets these — the installer above already ran
        # against dist\JARVIS\ without them.
        shell: pwsh
        run: |
          Copy-Item README.md            dist\JARVIS\
          Copy-Item START_JARVIS.bat     dist\JARVIS\
          Copy-Item START_JARVIS_API.bat dist\JARVIS\
          Copy-Item .env.example         dist\JARVIS\

      - name: Package portable ZIP
        shell: pwsh
        run: Compress-Archive -Path dist\JARVIS -DestinationPath "JARVIS-Portable-${{ steps.version.outputs.version }}.zip"

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\release-artifacts | Out-Null
          Copy-Item "JARVIS-Portable-${{ steps.version.outputs.version }}.zip" dist\release-artifacts\
          Copy-Item "dist\installer\JARVIS-Setup-${{ steps.version.outputs.version }}.exe" dist\release-artifacts\
          $lines = Get-ChildItem dist\release-artifacts | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" }
          Set-Content -Path dist\release-artifacts\SHA256SUMS.txt -Value $lines
          Get-Content dist\release-artifacts\SHA256SUMS.txt

      # Narrowly-scoped Windows test mode: JARVIS_APPDATA_OVERRIDE isolates
      # every path under a throwaway temp dir (app.core.paths), and
      # JARVIS_TEST_MODE=1 only disables the browser auto-open step
      # (app.core.launcher) — nothing about security, secrets, or execution
      # changes. See docs/WINDOWS_INSTALLER.md "Windows Runtime Test Mode".
      - name: Installer smoke test (silent install, health check, silent uninstall)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installDir = Join-Path $env:RUNNER_TEMP "jarvis-install-test"
          $appData    = Join-Path $env:RUNNER_TEMP "jarvis-appdata-test"
          New-Item -ItemType Directory -Force -Path $appData | Out-Null

          $installerPath = "dist\installer\JARVIS-Setup-${{ steps.version.outputs.version }}.exe"
          Write-Host "Installing silently to $installDir ..."
          Start-Process -FilePath $installerPath -Wait -NoNewWindow -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir"
          )

          $exePath = Join-Path $installDir "JARVIS.exe"
          if (-not (Test-Path $exePath)) {
            throw "Installed exe not found at $exePath — install may have failed."
          }
          Write-Host "Install OK: $exePath"

          if (Test-Path (Join-Path $installDir ".env")) {
            throw "A .env file was found in the install directory — production install must never require or ship one."
          }
          Write-Host "No .env in the install directory — OK."

          $strayFiles = @(".env.example", "START_JARVIS.bat", "START_JARVIS_API.bat", "DEV_SETUP_FROM_SOURCE.bat")
          foreach ($f in $strayFiles) {
            if (Test-Path (Join-Path $installDir $f)) {
              throw "Found '$f' in the installed app directory — the installer must only ship the app itself, never dev/portable-ZIP helper files."
            }
          }
          Write-Host "No dev/portable helper files leaked into the installed app directory — OK."

          $env:JARVIS_APPDATA_OVERRIDE = $appData
          $env:JARVIS_TEST_MODE = "1"
          $env:JARVIS_PORT = "58234"
          Write-Host "Launching JARVIS (test mode: no browser auto-open, isolated AppData) ..."
          $proc = Start-Process -FilePath $exePath -PassThru -WindowStyle Hidden

          try {
            $healthy = $false
            for ($i = 0; $i -lt 40; $i++) {
              try {
                $resp = Invoke-WebRequest -Uri "http://127.0.0.1:58234/health" -UseBasicParsing -TimeoutSec 2
                if ($resp.StatusCode -eq 200) { $healthy = $true; break }
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $healthy) { throw "JARVIS did not become healthy within the timeout." }
            Write-Host "Health check OK."

            $onboarding = Invoke-WebRequest -Uri "http://127.0.0.1:58234/ui/onboarding" -UseBasicParsing
            if ($onboarding.StatusCode -ne 200) { throw "Onboarding route did not return 200." }
            Write-Host "Onboarding route OK."

            $dbPath = Join-Path $appData "JARVIS\data\jarvis.db"
            if (-not (Test-Path $dbPath)) { throw "Database was not created under the isolated AppData dir: $dbPath" }
            Write-Host "Database created at the correct AppData location: $dbPath"
          } finally {
            Write-Host "Stopping JARVIS (graceful attempt, then force) ..."
            & taskkill /PID $proc.Id 2>$null | Out-Null
            Start-Sleep -Seconds 3
            if (-not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }
          }

          Write-Host "Uninstalling silently (default: preserve user data) ..."
          $uninstallerPath = Join-Path $installDir "unins000.exe"
          if (-not (Test-Path $uninstallerPath)) {
            throw "Uninstaller not found at $uninstallerPath."
          }
          # InitializeUninstall()'s prompt defaults to "No" (preserve data);
          # /VERYSILENT suppresses all UI, which takes that default answer —
          # so this run specifically exercises the "preserve data" path.
          Start-Process -FilePath $uninstallerPath -Wait -NoNewWindow -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          )

          if (Test-Path $exePath) {
            throw "Install directory still present after uninstall: $installDir"
          }
          Write-Host "Uninstall removed the install directory — OK."

          if (-not (Test-Path (Join-Path $appData "JARVIS"))) {
            throw "User data directory was removed even though deletion was never confirmed — this must never happen."
          }
          Write-Host "User data preserved after uninstall (default behaviour) — OK."

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Portable-${{ steps.version.outputs.version }}
          path: JARVIS-Portable-${{ steps.version.outputs.version }}.zip
          retention-days: 30

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Setup-${{ steps.version.outputs.version }}
          path: dist\installer\JARVIS-Setup-${{ steps.version.outputs.version }}.exe
          retention-days: 30

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: dist\release-artifacts\SHA256SUMS.txt
          retention-days: 30

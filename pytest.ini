[pytest]
testpaths = tests
markers =
    browser: real-browser Playwright + axe tests. Requires `pip install playwright axe-playwright-python`
        and `playwright install chromium`. Excluded from the default run (see addopts) since most
        environments won't have a browser installed; run explicitly with `pytest -m browser`.
addopts = -m "not browser"
# Suppress the httpx/starlette TestClient version-mismatch deprecation warning.
# This is a packaging quirk between starlette 1.3+ and httpx <2; it is not
# a bug in JARVIS code.
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient`
